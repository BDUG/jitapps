[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codingagentlib"
version = "0.1.0"
description = "Headless coding agent workspace runtime and language adapters"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.optional-dependencies]
embeddings = ["onnxruntime==1.22.1", "tokenizers==0.21.4"]

[project.scripts]
codingagentlib = "codingagentlib.__main__:main"

[tool.setuptools]
packages = ["codingagentlib", "codingagentlib.python"]
package-dir = {codingagentlib = "."}

[tool.setuptools.package-data]
codingagentlib = ["protocol.json", "integration-context.schema.json", "javascript/*.js", "javascript/package.json", "python/code-navigation/*.cjs", "python/code-navigation/*.json"]
